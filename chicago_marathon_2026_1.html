<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chicago 26.2">
<meta name="theme-color" content="#1a1a2e">
<title>Chicago Marathon 2026</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #22223b;
    --surface3: #2d2d4a;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #f0f0f8;
    --text2: #9999bb;
    --text3: #6666aa;
    --blue: #4a9eff;
    --blue-bg: rgba(74,158,255,0.15);
    --purple: #9b8fef;
    --purple-bg: rgba(155,143,239,0.15);
    --green: #5ec97a;
    --green-bg: rgba(94,201,122,0.15);
    --amber: #f0a433;
    --amber-bg: rgba(240,164,51,0.15);
    --red: #f06060;
    --red-bg: rgba(240,96,96,0.15);
    --teal: #3ecfb2;
    --teal-bg: rgba(62,207,178,0.15);
    --accent: #4a9eff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* STATUS BAR SAFE AREA */
  .status-bar { height: env(safe-area-inset-top, 0px); background: var(--bg); flex-shrink: 0; }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border2);
    padding: 12px 16px 10px;
    flex-shrink: 0;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .app-title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .race-countdown {
    font-size: 12px;
    background: var(--red-bg);
    color: var(--red);
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { background: var(--surface2); border-radius: 10px; padding: 8px 6px; text-align: center; }
  .stat-label { font-size: 10px; color: var(--text3); margin-bottom: 2px; }
  .stat-value { font-size: 16px; font-weight: 600; color: var(--text); }

  /* MONTH NAV */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px 6px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .month-nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--surface2);
    border: none;
    color: var(--text);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .month-nav-btn:active { background: var(--surface3); }
  .month-label { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
  .phase-pill {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
  }

  /* DOW HEADERS */
  .dow-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 0 8px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .dow-cell { text-align: center; font-size: 11px; color: var(--text3); padding: 4px 0; font-weight: 500; }

  /* CALENDAR SCROLL */
  .cal-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 8px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; padding-bottom: 8px; }

  .day-cell {
    border-radius: 8px;
    background: var(--surface);
    min-height: 70px;
    padding: 5px 4px;
    cursor: pointer;
    border: 0.5px solid var(--border);
    position: relative;
    transition: border-color 0.1s;
  }
  .day-cell.other-month { opacity: 0.3; }
  .day-cell.today { border-color: var(--blue); border-width: 1.5px; }
  .day-cell.selected { border-color: var(--accent); border-width: 1.5px; background: var(--surface2); }
  .day-cell:active { background: var(--surface2); }

  .day-num {
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 3px;
    font-weight: 400;
  }
  .day-cell.today .day-num {
    color: var(--blue);
    font-weight: 600;
  }

  .chip {
    font-size: 9px;
    padding: 2px 4px;
    border-radius: 3px;
    margin-bottom: 2px;
    font-weight: 600;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .chip-run { background: var(--blue-bg); color: var(--blue); }
  .chip-f45 { background: var(--purple-bg); color: var(--purple); }
  .chip-long { background: var(--green-bg); color: var(--green); }
  .chip-race { background: var(--red-bg); color: var(--red); }
  .chip-hyrox { background: var(--amber-bg); color: var(--amber); }
  .chip-rest { background: rgba(255,255,255,0.04); color: var(--text3); }
  .chip.done { opacity: 0.4; }

  .done-dot {
    position: absolute;
    top: 4px; right: 4px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
  }

  /* BOTTOM SHEET */
  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .sheet-overlay.visible { opacity: 1; pointer-events: all; }
  .bottom-sheet {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 0 0 env(safe-area-inset-bottom, 16px);
    z-index: 101;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    max-height: 80dvh;
    display: flex;
    flex-direction: column;
  }
  .bottom-sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin: 10px auto 0;
    flex-shrink: 0;
  }
  .sheet-header {
    padding: 12px 16px 10px;
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }
  .sheet-date { font-size: 17px; font-weight: 600; }
  .sheet-phase { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; padding: 8px 0; }
  .workout-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 0.5px solid var(--border);
  }
  .workout-row:last-child { border-bottom: none; }
  .check-btn {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border2);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    -webkit-appearance: none;
    transition: all 0.15s;
  }
  .check-btn.checked {
    background: var(--green);
    border-color: var(--green);
  }
  .check-icon { font-size: 14px; line-height: 1; }
  .workout-info { flex: 1; }
  .workout-name { font-size: 15px; font-weight: 500; }
  .workout-name.done { text-decoration: line-through; color: var(--text3); }
  .workout-chip-row { margin-top: 3px; }
  .w-chip {
    display: inline-block;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 600;
  }
  .sheet-actions { padding: 12px 16px; flex-shrink: 0; }
  .mark-all-btn {
    width: 100%;
    padding: 14px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .mark-all-btn:active { opacity: 0.85; }
  .mark-all-btn.all-done { background: var(--surface3); color: var(--text2); }

  /* LEGEND */
  .legend-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    padding: 6px 16px 8px;
    flex-shrink: 0;
  }
  .leg { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text3); }
  .leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .no-training { padding: 24px 16px; text-align: center; color: var(--text3); font-size: 14px; }
</style>
</head>
<body>

<div class="status-bar"></div>

<div class="header">
  <div class="header-top">
    <div class="app-title">🏃 Chicago 26.2</div>
    <div class="race-countdown" id="countdown">— days to go</div>
  </div>
  <div class="stats-row" id="statsRow"></div>
</div>

<div class="month-nav">
  <button class="month-nav-btn" id="prevBtn">‹</button>
  <div>
    <div class="month-label" id="monthLabel"></div>
  </div>
  <button class="month-nav-btn" id="nextBtn">›</button>
</div>

<div class="legend-row">
  <div class="leg"><div class="leg-dot" style="background:#4a9eff"></div>Run</div>
  <div class="leg"><div class="leg-dot" style="background:#9b8fef"></div>F45</div>
  <div class="leg"><div class="leg-dot" style="background:#5ec97a"></div>Long</div>
  <div class="leg"><div class="leg-dot" style="background:#f06060"></div>Race</div>
  <div class="leg"><div class="leg-dot" style="background:#f0a433"></div>HYROX</div>
</div>

<div class="dow-row">
  <div class="dow-cell">S</div><div class="dow-cell">M</div><div class="dow-cell">T</div>
  <div class="dow-cell">W</div><div class="dow-cell">T</div><div class="dow-cell">F</div>
  <div class="dow-cell">S</div>
</div>

<div class="cal-scroll">
  <div class="cal-grid" id="calGrid"></div>
</div>

<div class="sheet-overlay" id="overlay" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-date" id="sheetDate"></div>
    <div class="sheet-phase" id="sheetPhase"></div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-actions" id="sheetActions"></div>
</div>

<script>
const STORAGE_KEY = 'chicago_2026_v1';
let done = {};
try { const s = localStorage.getItem(STORAGE_KEY); if (s) done = JSON.parse(s); } catch(e) {}
function saveDone() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(done)); } catch(e) {} }

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const phases = [
  { label: 'Phase 1: Base', start: '2026-05-01', end: '2026-06-01', color: '#4a9eff' },
  { label: 'Phase 2: Build', start: '2026-06-02', end: '2026-07-13', color: '#9b8fef' },
  { label: 'Phase 3: Peak', start: '2026-07-14', end: '2026-08-17', color: '#5ec97a' },
  { label: 'Phase 4: Race prep', start: '2026-08-18', end: '2026-09-14', color: '#f0a433' },
  { label: 'Phase 5: Taper', start: '2026-09-15', end: '2026-10-11', color: '#f06060' },
];

function getPhase(k) { return phases.find(p => k >= p.start && k <= p.end) || null; }

const schedule = {};
const weeks = [
  ['2026-05-01',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Easy 4 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'F45',c:'f45'}],Fri:[{t:'Rest',c:'rest'}],Sat:[{t:'Long 8 mi',c:'long'}],Sun:[{t:'F45 or rest',c:'f45'}]}],
  ['2026-05-08',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Easy 5 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'F45',c:'f45'}],Fri:[{t:'Rest',c:'rest'}],Sat:[{t:'Long 9 mi',c:'long'}],Sun:[{t:'F45 or rest',c:'f45'}]}],
  ['2026-05-15',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Easy 5 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'F45',c:'f45'}],Fri:[{t:'Rest',c:'rest'}],Sat:[{t:'Long 10 mi',c:'long'}],Sun:[{t:'F45',c:'f45'}]}],
  ['2026-05-22',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Easy 4 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'F45',c:'f45'}],Fri:[{t:'Rest',c:'rest'}],Sat:[{t:'Long 7 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-05-29',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Easy 6 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'F45',c:'f45'}],Fri:[{t:'Rest',c:'rest'}],Sat:[{t:'Long 12 mi',c:'long'}],Sun:[{t:'F45',c:'f45'}]}],
  ['2026-06-02',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Tempo 5 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'F45',c:'f45'}],Fri:[{t:'Easy 4 mi',c:'run'}],Sat:[{t:'Long 12 mi',c:'long'}],Sun:[{t:'F45 or rest',c:'f45'}]}],
  ['2026-06-09',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Tempo 6 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'F45',c:'f45'}],Fri:[{t:'Easy 4 mi',c:'run'}],Sat:[{t:'Long 13 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-06-16',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Easy 5 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'F45',c:'f45'}],Fri:[{t:'Rest',c:'rest'}],Sat:[{t:'Long 9 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-06-23',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Tempo 6 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'F45',c:'f45'}],Fri:[{t:'Easy 5 mi',c:'run'}],Sat:[{t:'Long 14 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-06-30',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Progression 7 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'F45',c:'f45'}],Fri:[{t:'Easy 5 mi',c:'run'}],Sat:[{t:'Long 15 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-07-07',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Tempo 7 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'F45',c:'f45'}],Fri:[{t:'Easy 5 mi',c:'run'}],Sat:[{t:'Long 16 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-07-14',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Easy 5 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'F45',c:'f45'}],Fri:[{t:'Rest',c:'rest'}],Sat:[{t:'Long 10 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-07-21',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Tempo 7 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'Easy 5 mi',c:'run'}],Fri:[{t:'F45',c:'f45'}],Sat:[{t:'Long 18 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-07-28',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'MP miles 8 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'Easy 6 mi',c:'run'}],Fri:[{t:'F45',c:'f45'}],Sat:[{t:'Long 19 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-08-04',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'Tempo 8 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'Easy 6 mi',c:'run'}],Fri:[{t:'F45',c:'f45'}],Sat:[{t:'Long 20 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-08-11',{Mon:[{t:'F45',c:'f45'}],Tue:[{t:'MP miles 8 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'Easy 5 mi',c:'run'}],Fri:[{t:'F45',c:'f45'}],Sat:[{t:'Long 18 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-08-18',{Mon:[{t:'F45 (upper)',c:'f45'}],Tue:[{t:'Tempo 5 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'Easy 4 mi',c:'run'}],Fri:[{t:'F45 (upper)',c:'f45'}],Sat:[{t:'Easy 8 mi',c:'run'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-08-25',{Mon:[{t:'F45 (upper)',c:'f45'}],Tue:[{t:'Easy 4 mi',c:'run'}],Wed:[{t:'Easy 3 mi shakeout',c:'run'}],Thu:[{t:'Rest',c:'rest'}],Fri:[{t:'Rest',c:'rest'}],Sat:[{t:'10-MILER RACE',c:'race'}],Sun:[{t:'Rest/walk',c:'rest'}]}],
  ['2026-09-01',{Mon:[{t:'Easy recovery 3 mi',c:'run'}],Tue:[{t:'Rest',c:'rest'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'HYROX SINGLES',c:'hyrox'}],Fri:[{t:'Rest',c:'rest'}],Sat:[{t:'Easy 5 mi',c:'run'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-09-08',{Mon:[{t:'F45 (upper)',c:'f45'}],Tue:[{t:'Easy 5 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'Easy 4 mi',c:'run'}],Fri:[{t:'F45 (upper)',c:'f45'}],Sat:[{t:'Long 12 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-09-15',{Mon:[{t:'F45 (upper)',c:'f45'}],Tue:[{t:'Tempo 5 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'Easy 4 mi',c:'run'}],Fri:[{t:'Rest',c:'rest'}],Sat:[{t:'Long 14 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-09-22',{Mon:[{t:'F45 (upper)',c:'f45'}],Tue:[{t:'Tempo 4 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'Easy 4 mi',c:'run'}],Fri:[{t:'Rest',c:'rest'}],Sat:[{t:'Long 12 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-09-29',{Mon:[{t:'Rest or light F45',c:'rest'}],Tue:[{t:'Easy 4 mi',c:'run'}],Wed:[{t:'Easy 5K',c:'run'}],Thu:[{t:'Easy 3 mi',c:'run'}],Fri:[{t:'Rest',c:'rest'}],Sat:[{t:'Easy 8 mi',c:'long'}],Sun:[{t:'Rest',c:'rest'}]}],
  ['2026-10-06',{Mon:[{t:'Rest',c:'rest'}],Tue:[{t:'Easy 3 mi',c:'run'}],Wed:[{t:'Easy 2 mi shakeout',c:'run'}],Thu:[{t:'Rest',c:'rest'}],Fri:[{t:'Rest',c:'rest'}],Sat:[{t:'Rest / travel',c:'rest'}],Sun:[{t:'CHICAGO MARATHON',c:'race'}]}],
];

const dowOrder = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
weeks.forEach(([ws, dayMap]) => {
  const base = new Date(ws + 'T12:00:00');
  const dow = base.getDay();
  const monday = new Date(base);
  monday.setDate(base.getDate() - dow + 1);
  dowOrder.forEach((d, i) => {
    const dt = new Date(monday);
    dt.setDate(monday.getDate() + i);
    const k = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    if (dayMap[d]) schedule[k] = dayMap[d];
  });
});

const today = new Date();
const todayKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

let currentYear = today.getFullYear();
let currentMonth = today.getMonth();
// Clamp to training range
if (currentMonth < 4) { currentMonth = 4; currentYear = 2026; }
if (currentYear > 2026 || (currentYear === 2026 && currentMonth > 9)) { currentMonth = 9; currentYear = 2026; }

let selectedDate = null;

function chipCls(c) {
  return { run:'chip chip-run', f45:'chip chip-f45', long:'chip chip-long', race:'chip chip-race', hyrox:'chip chip-hyrox', rest:'chip chip-rest' }[c] || 'chip chip-rest';
}
function wChipStyle(c) {
  const m = { run:'background:rgba(74,158,255,0.15);color:#4a9eff', f45:'background:rgba(155,143,239,0.15);color:#9b8fef', long:'background:rgba(94,201,122,0.15);color:#5ec97a', race:'background:rgba(240,96,96,0.15);color:#f06060', hyrox:'background:rgba(240,164,51,0.15);color:#f0a433', rest:'background:rgba(255,255,255,0.06);color:#6666aa' };
  return m[c] || m.rest;
}

function isDone(k, i) { return done[k] && done[k][i]; }

function allWorkoutsDone(k) {
  const ws = schedule[k]; if (!ws) return false;
  return ws.every((_, i) => isDone(k, i));
}

function countStats() {
  let total = 0, comp = 0, mTotal = 0, mComp = 0;
  Object.keys(schedule).forEach(k => {
    schedule[k].forEach((w, i) => {
      if (w.c !== 'rest') {
        total++;
        if (isDone(k, i)) comp++;
        const [y, m] = k.split('-').map(Number);
        if (y === currentYear && m - 1 === currentMonth) {
          mTotal++;
          if (isDone(k, i)) mComp++;
        }
      }
    });
  });
  return { total, comp, mTotal, mComp };
}

function daysToRace() {
  const race = new Date('2026-10-12T00:00:00');
  const now = new Date();
  return Math.max(0, Math.ceil((race - now) / 86400000));
}

function renderStats() {
  const { total, comp, mTotal, mComp } = countStats();
  const pct = total > 0 ? Math.round(comp / total * 100) : 0;
  document.getElementById('countdown').textContent = daysToRace() + ' days to go';
  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="stat-label">Progress</div><div class="stat-value">${pct}%</div></div>
    <div class="stat"><div class="stat-label">Done</div><div class="stat-value">${comp}/${total}</div></div>
    <div class="stat"><div class="stat-label">This month</div><div class="stat-value">${mComp}/${mTotal}</div></div>
    <div class="stat"><div class="stat-label">Days left</div><div class="stat-value">${daysToRace()}</div></div>
  `;
}

function renderCalendar() {
  renderStats();
  const phaseForMonth = getPhase(`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-15`);
  document.getElementById('monthLabel').textContent = `${MONTHS[currentMonth]} ${currentYear}`;

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const prevDays = new Date(currentYear, currentMonth, 0).getDate();
  let html = '';

  for (let i = 0; i < firstDay; i++) {
    const d = prevDays - firstDay + 1 + i;
    const m = currentMonth === 0 ? 11 : currentMonth - 1;
    const y = currentMonth === 0 ? currentYear - 1 : currentYear;
    const k = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    html += `<div class="day-cell other-month"><div class="day-num">${d}</div></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const k = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ws = schedule[k];
    const isToday = k === todayKey;
    const isSel = k === selectedDate;
    const allDone = ws && allWorkoutsDone(k);
    const phase = getPhase(k);
    let cls = 'day-cell';
    if (isToday) cls += ' today';
    if (isSel) cls += ' selected';
    const phaseBorder = phase && !isToday && !isSel ? `border-color:${phase.color}40;` : '';

    html += `<div class="${cls}" style="${phaseBorder}" onclick="tapDay('${k}')">`;
    html += `<div class="day-num">${d}</div>`;
    if (ws) {
      ws.slice(0, 2).forEach((w, i) => {
        html += `<span class="${chipCls(w.c)}${isDone(k, i) ? ' done' : ''}">${w.t}</span>`;
      });
      if (ws.length > 2) html += `<span style="font-size:9px;color:#6666aa">+${ws.length - 2}</span>`;
    }
    if (allDone) html += `<div class="done-dot"></div>`;
    html += '</div>';
  }

  const used = firstDay + daysInMonth;
  const rem = (7 - (used % 7)) % 7;
  for (let i = 1; i <= rem; i++) {
    html += `<div class="day-cell other-month"><div class="day-num">${i}</div></div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

function tapDay(k) {
  selectedDate = k;
  renderCalendar();
  openSheet(k);
}

function openSheet(k) {
  const ws = schedule[k];
  const phase = getPhase(k);
  const dt = new Date(k + 'T12:00:00');
  document.getElementById('sheetDate').textContent = dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  document.getElementById('sheetPhase').textContent = phase ? phase.label : 'Outside training window';
  if (phase) document.getElementById('sheetPhase').style.color = phase.color;

  if (!ws) {
    document.getElementById('sheetBody').innerHTML = '<div class="no-training">No training scheduled</div>';
    document.getElementById('sheetActions').innerHTML = '';
  } else {
    let bodyHtml = '';
    ws.forEach((w, i) => {
      const checked = isDone(k, i);
      bodyHtml += `<div class="workout-row">
        <button class="check-btn${checked ? ' checked' : ''}" onclick="toggle('${k}',${i})">
          ${checked ? '<span class="check-icon">✓</span>' : ''}
        </button>
        <div class="workout-info">
          <div class="workout-name${checked ? ' done' : ''}">${w.t}</div>
          <div class="workout-chip-row"><span class="w-chip" style="${wChipStyle(w.c)}">${w.c}</span></div>
        </div>
      </div>`;
    });
    document.getElementById('sheetBody').innerHTML = bodyHtml;
    const allDone = ws.every((_, i) => isDone(k, i));
    document.getElementById('sheetActions').innerHTML = `
      <button class="mark-all-btn${allDone ? ' all-done' : ''}" onclick="markAll('${k}')">
        ${allDone ? 'All done ✓' : 'Mark all complete'}
      </button>`;
  }

  document.getElementById('overlay').classList.add('visible');
  document.getElementById('sheet').classList.add('open');
}

function closeSheet() {
  selectedDate = null;
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('sheet').classList.remove('open');
  renderCalendar();
}

function toggle(k, i) {
  if (!done[k]) done[k] = {};
  done[k][i] = !done[k][i];
  saveDone();
  openSheet(k);
  renderCalendar();
}

function markAll(k) {
  const ws = schedule[k]; if (!ws) return;
  if (!done[k]) done[k] = {};
  const allDone = ws.every((_, i) => isDone(k, i));
  ws.forEach((_, i) => { done[k][i] = !allDone; });
  saveDone();
  openSheet(k);
  renderCalendar();
}

document.getElementById('prevBtn').onclick = () => {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
};
document.getElementById('nextBtn').onclick = () => {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderCalendar();
};

// Swipe to close sheet
let touchStartY = 0;
document.getElementById('sheet').addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
document.getElementById('sheet').addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - touchStartY > 60) closeSheet();
}, { passive: true });

renderCalendar();
</script>
</body>
</html>
